<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>my-auto-platform Dashboard</title><style>body{margin:0;font:16px system-ui;background:#020617;color:#f8fafc}main{max-width:1200px;margin:auto;padding:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.nav a,button{padding:10px 14px;border:1px solid #334155;border-radius:9px;background:#0f172a;color:#f8fafc;text-decoration:none;cursor:pointer}.hero,.card{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:18px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #1e293b;overflow-wrap:anywhere}.muted{color:#94a3b8}.ok{color:#34d399}.bad{color:#fb7185}@media(max-width:600px){main{padding:10px}.row{display:block}.row b{display:block;margin-top:3px}}</style></head><body><main><nav class="nav"><a href="/">Home</a><a href="/admin">Admin</a><a href="/integrations">Integrations</a><button id="refresh">Refresh</button><button id="logout">Logout</button></nav><section class="hero"><h1>DevOps Dashboard</h1><p class="muted">GitHub → Render production control center</p><div id="summary">Checking…</div></section><section id="cards" class="grid"><div class="card">Loading…</div></section></main><script>'use strict';const $=id=>document.getElementById(id);const esc=v=>String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const safe=v=>{try{const u=new URL(String(v),location.origin);return /^https?:$/.test(u.protocol)?u.href:''}catch{return''}};function card(name,d){const domain=safe(d.domain);return `<article class="card"><h2>${esc(name)} <span class="${d.buildStatus==='success'?'ok':'bad'}">${esc(d.buildStatus)}</span></h2><div class="row"><span>Project</span><b>${esc(d.projectName)}</b></div><div class="row"><span>Environment</span><b>${esc(d.environment)}</b></div><div class="row"><span>Branch</span><b>${esc(d.branch||'—')}</b></div><div class="row"><span>Commit</span><b>${esc(d.lastCommitSha||'—')}</b></div><div class="row"><span>Domain</span><b>${domain?`<a href="${esc(domain)}" target="_blank" rel="noopener noreferrer">${esc(domain)}</a>`:'—'}</b></div></article>`}async function refresh(){try{const r=await fetch('/api/devops/status',{cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();const items=[['GitHub',d.github],['Render',d.render]].filter(x=>x[1]);$('summary').innerHTML=`<strong class="ok">${esc(d.overallStatus)}</strong> · ${esc(d.architecture)} · ${items.length} platforms`;$('cards').innerHTML=items.map(x=>card(x[0],x[1])).join('')}catch(e){$('summary').innerHTML=`<strong class="bad">Dashboard API unavailable</strong> · ${esc(e.message)}`;$('cards').innerHTML='<div class="card bad">Unable to load deployment status.</div>'}}$('refresh').onclick=refresh;$('logout').onclick=async()=>{await fetch('/api/auth/logout',{method:'POST'});location.href='/'};refresh();</script></body></html>
