<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Profile</title><style>body{margin:0;padding:20px;font:16px system-ui;background:#0f172a;color:#f8fafc}.wrap{max-width:800px;margin:auto}.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.pill{display:inline-block;padding:7px 10px;border-radius:8px;background:#334155}a,button{padding:11px 14px;border-radius:9px;border:1px solid #475569;background:#1e293b;color:white;text-decoration:none}button{cursor:pointer}</style></head><body><div class="wrap"><nav><a href="/">Home</a> <a href="/dashboard">Dashboard</a> <button onclick="logout()">Logout</button></nav><section class="card"><h1>Admin Profile</h1><div id="profile">Loading…</div></section><section class="card"><h2>Security & RBAC</h2><div id="security">Loading…</div></section><section class="card"><h2>System Backup</h2><p>Generate an authenticated project backup.</p><a href="/api/backup/export">Download backup</a></section><script>async function load(){const r=await fetch('/api/admin/profile');const d=await r.json();if(!r.ok){location.href='/login.html';return}profile.innerHTML='<div class="grid"><div>Email<br><b>'+esc(d.user.email)+'</b></div><div>Name<br><b>'+esc(d.user.name)+'</b></div><div>Role<br><span class="pill">'+esc(d.user.role)+'</span></div></div>';security.innerHTML='<p>'+esc(d.security.session)+' · '+esc(d.security.tokenExpiry)+'</p><p>Permissions: '+d.rbac.permissions.map(esc).join(', ')+'</p>'}function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function logout(){await fetch('/api/auth/logout',{method:'POST'});location.href='/'}load()</script></body></html>
