<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Profile</title><style>body{margin:0;padding:20px;font:16px system-ui;background:#0f172a;color:#f8fafc}.wrap{max-width:850px;margin:auto}.platform-navbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.platform-navbar a,.platform-navbar button{padding:11px 14px;border-radius:9px;border:1px solid #475569;background:#1e293b;color:white;text-decoration:none;cursor:pointer}.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.pill{display:inline-block;padding:7px 10px;border-radius:8px;background:#334155}input,button{padding:11px 14px;border-radius:9px;border:1px solid #475569;background:#1e293b;color:white}button{cursor:pointer}input{width:100%;box-sizing:border-box;margin:8px 0}.msg{min-height:24px}.ok{color:#34d399}.bad{color:#fb7185}</style></head><body><div class="wrap"><nav class="platform-navbar" data-navbar aria-label="Main navigation"></nav><section class="card"><h1>Admin Profile</h1><div id="profile">Loading…</div></section><section class="card"><h2>Security & RBAC</h2><div id="security">Loading…</div></section><section class="card"><h2>System Backup</h2><p>Download the current native JSON/memory store directly; no persistent disk is required.</p><a href="/api/backup/export">Download JSON backup</a><h3>Restore legacy archive</h3><form id="restore"><input id="archive" name="archive" type="file" accept=".gz,.tgz,application/gzip" required><button>Validate & Restore</button></form><div id="msg" class="msg"></div></section></div><script src="/navbar.js" defer></script><script>const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){try{const r=await fetch('/api/admin/profile'),d=await r.json();if(!r.ok){location.href='/login';return}document.getElementById('profile').innerHTML='<div class="grid"><div>Email<br><b>'+esc(d.user.email)+'</b></div><div>Name<br><b>'+esc(d.user.name)+'</b></div><div>Role<br><span class="pill">'+esc(d.user.role)+'</span></div></div>';document.getElementById('security').innerHTML='<p>'+esc(d.security.session)+' · '+esc(d.security.tokenExpiry)+'</p><p>Permissions: '+d.rbac.permissions.map(esc).join(', ')+'</p>'}catch(_){location.href='/login'}}document.getElementById('restore').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='Validating…';msg.className='msg';try{const r=await fetch('/api/backup/restore',{method:'POST',body:new FormData(e.currentTarget)}),d=await r.json();msg.textContent=d.error||d.message||'Restore complete';msg.className='msg '+(r.ok?'ok':'bad')}catch(_){msg.textContent='Restore request failed';msg.className='msg bad'}};load();</script></body></html>
