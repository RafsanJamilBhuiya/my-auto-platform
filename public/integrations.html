<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Integrations</title><style>body{margin:0;padding:20px;font:16px system-ui;background:#0f172a;color:#f8fafc}.wrap{max-width:1000px;margin:auto}.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;margin:16px 0}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,button{padding:12px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white;box-sizing:border-box}button{background:#2563eb;cursor:pointer}.list{display:grid;gap:10px}.item{padding:14px;border:1px solid #334155;border-radius:10px;overflow-wrap:anywhere}</style></head><body><div class="wrap"><nav><a href="/">Home</a> · <a href="/dashboard">Dashboard</a> · <a href="/admin.html">Admin</a></nav><div class="card"><h1>Integrations / Plugins</h1><form id="f"><input name="name" placeholder="Integration name" required><input name="type" placeholder="webhook / service" value="webhook"><input name="endpoint" type="url" placeholder="https://example.com/webhook" required><button>Add integration</button></form></div><div class="card"><h2>Connected services</h2><div id="list" class="list">Loading…</div></div></div><script>async function load(){const r=await fetch('/api/integrations');const d=await r.json();if(!r.ok){location.href='/login.html';return}list.innerHTML=d.integrations.length?d.integrations.map(x=>'<div class="item"><b>'+esc(x.name)+'</b> · '+esc(x.type)+' · '+(x.enabled?'Enabled':'Disabled')+'<br>'+esc(x.endpoint)+'</div>').join(''):'No integrations yet.'}f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/integrations',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});if(r.ok){f.reset();load()}else{alert((await r.json()).error||'Failed')}};function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}load()</script></body></html>
