<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Integrations · my-auto-platform</title><style>body{margin:0;padding:20px;font:16px system-ui;background:#0f172a;color:#f8fafc}.wrap{max-width:1000px;margin:auto}.platform-navbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.platform-navbar a,.platform-navbar button{padding:10px 14px;border-radius:9px;border:1px solid #475569;background:#1e293b;color:white;text-decoration:none;cursor:pointer}.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;margin:16px 0}.providers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.provider{border:1px solid #475569;border-radius:12px;padding:14px}.ok{color:#34d399}.muted{color:#94a3b8}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,button{padding:12px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white;box-sizing:border-box}button{background:#2563eb;cursor:pointer}.list{display:grid;gap:10px}.item{padding:14px;border:1px solid #334155;border-radius:10px;overflow-wrap:anywhere}.msg{min-height:24px}</style></head><body><div class="wrap"><nav class="platform-navbar" data-navbar></nav><div class="card"><h1>Integrations / Plugins</h1><p class="muted">Google service configuration uses Render environment variables; secrets are never rendered in this UI.</p><div id="providers" class="providers">Loading Google configuration…</div></div><div class="card"><h2>Webhook integrations</h2><form id="f"><input name="name" placeholder="Integration name" required><input name="type" placeholder="webhook / service" value="webhook"><input name="endpoint" type="url" placeholder="https://example.com/webhook" required><button>Add integration</button></form><p id="msg" class="msg"></p></div><div class="card"><h2>Connected services</h2><div id="list" class="list">Loading…</div></div></div><script src="/navbar.js" defer></script><script>const list=document.getElementById('list'),f=document.getElementById('f'),msg=document.getElementById('msg'),providers=document.getElementById('providers');const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){try{const [r,g]=await Promise.all([fetch('/api/integrations',{cache:'no-store'}),fetch('/api/integrations/google',{cache:'no-store'})]);if(r.status===401){location.href='/login';return}const d=await r.json(),gd=g.ok?await g.json():null;list.innerHTML=d.integrations?.length?d.integrations.map(x=>'<div class="item"><b>'+esc(x.name)+'</b> · '+esc(x.type)+' · '+(x.enabled?'Enabled':'Disabled')+'<br>'+esc(x.endpoint)+'</div>').join(''):'No integrations yet.';if(gd?.providers)providers.innerHTML=Object.entries(gd.providers).map(([k,v])=>'<div class="provider"><h3>Google '+esc(k[0].toUpperCase()+k.slice(1))+'</h3><p class="'+(v.configured?'ok':'muted')+'">'+(v.configured?'Configured':'Placeholder / not configured')+'</p><small>'+esc(v.scope||'API key required')+'</small></div>').join('')}catch(_){list.textContent='Unable to load integrations.'}}f.onsubmit=async e=>{e.preventDefault();msg.textContent='Saving…';const r=await fetch('/api/integrations',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();if(r.ok){f.reset();msg.textContent='Integration added.';load()}else msg.textContent=d.error||'Failed'};load();setInterval(load,15000);</script></body></html>
