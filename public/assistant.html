<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistant · my-auto-platform</title><style>body{margin:0;padding:20px;font:16px system-ui;background:#020617;color:#f8fafc}.wrap{max-width:800px;margin:auto}.platform-navbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.platform-navbar a,.platform-navbar button{padding:10px 14px;border:1px solid #334155;border-radius:9px;background:#0f172a;color:#fff;text-decoration:none;cursor:pointer}.card{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:20px}.chat{min-height:260px;white-space:pre-wrap;background:#111827;padding:14px;border-radius:10px;margin-bottom:12px}.row{display:flex;gap:8px}.row input{flex:1}input,button{padding:12px;border-radius:9px;border:1px solid #475569;background:#0f172a;color:#fff}button{cursor:pointer}</style></head><body><div class="wrap"><nav class="platform-navbar" data-navbar></nav><section class="card"><h1>Platform Assistant</h1><div id="chat" class="chat">Assistant ready. Ask: status, users, integrations, or help.</div><form id="f" class="row"><input id="q" placeholder="Ask the assistant…" autocomplete="off" required><button>Send</button></form></section></div><script src="/navbar.js" defer></script><script>const chat=document.getElementById('chat'),form=document.getElementById('f'),q=document.getElementById('q');form.onsubmit=async e=>{e.preventDefault();const message=q.value.trim();if(!message)return;chat.textContent+='\n\nYou: '+message+'\nAssistant: …';q.value='';try{const r=await fetch('/api/assistant/chat',{method:'POST',headers:{'content-type':'application/json'},credentials:'same-origin',body:JSON.stringify({message})});const d=await r.json();if(r.status===401){location.href='/login';return}chat.textContent=chat.textContent.replace('Assistant: …','Assistant: '+(d.reply||d.error||'Request failed'));}catch(_){chat.textContent=chat.textContent.replace('Assistant: …','Assistant: request failed');}};</script></body></html>
