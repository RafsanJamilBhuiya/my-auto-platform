<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register · my-auto-platform</title><style>body{margin:0;font:16px system-ui;background:#0f172a;color:#f8fafc;min-height:100vh;padding:20px;box-sizing:border-box}.wrap{max-width:900px;margin:auto}.platform-navbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}.platform-navbar a,.platform-navbar button{padding:10px 14px;border:1px solid #334155;border-radius:9px;background:#111827;color:#f8fafc;text-decoration:none;cursor:pointer}.card{width:min(420px,100%);margin:auto;background:#1e293b;padding:24px;border-radius:16px;box-sizing:border-box}input,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white}button{background:#2563eb;border:0;font-weight:700;cursor:pointer}a{color:#93c5fd}#msg{min-height:24px}</style></head><body><div class="wrap"><nav class="platform-navbar" data-navbar aria-label="Main navigation"></nav><main class="card"><h1>Create account</h1><form id="f"><input name="name" placeholder="Name" autocomplete="name"><input name="email" type="email" placeholder="Email" autocomplete="email" required><input name="password" type="password" minlength="10" placeholder="Password (10+ chars)" autocomplete="new-password" required><button>Create account</button></form><p id="msg"></p><p><a href="/login">Back to login</a></p></main></div><script src="/navbar.js" defer></script><script>const f=document.getElementById('f'),msg=document.getElementById('msg');f.onsubmit=async e=>{e.preventDefault();msg.textContent='Creating account…';try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();if(r.ok)location.href='/dashboard';else msg.textContent=d.error||'Registration failed'}catch(_){msg.textContent='Registration request failed'}};</script></body></html>
