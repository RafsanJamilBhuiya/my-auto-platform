<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><style>body{margin:0;font:16px system-ui;background:#0f172a;color:#f8fafc;min-height:100vh;display:grid;place-items:center;padding:20px}form{width:min(420px,100%);background:#1e293b;padding:24px;border-radius:16px;box-sizing:border-box}input,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white}button{background:#2563eb;border:0;font-weight:700}a{color:#93c5fd}</style></head><body><form id="f"><h1>Create account</h1><input name="name" placeholder="Name"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" minlength="10" placeholder="Password (10+ chars)" required><button>Create account</button><p id="msg"></p><a href="/login.html">Back to login</a></form><script>f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const d=await r.json();if(r.ok)location.href='/dashboard';msg.textContent=d.error||'Registration failed'}</script></body></html>
