<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login · my-auto-platform</title>
  <style>
    body{margin:0;font:16px system-ui;background:#0f172a;color:#f8fafc;min-height:100vh;padding:20px;box-sizing:border-box}
    .wrap{max-width:900px;margin:auto}
    .platform-navbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
    .platform-navbar a,.platform-navbar button{padding:10px 14px;border:1px solid #334155;border-radius:9px;background:#111827;color:#f8fafc;text-decoration:none;cursor:pointer}
    .card{width:min(420px,100%);margin:auto;background:#1e293b;padding:24px;border-radius:16px;box-sizing:border-box}
    input,.submit{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white}
    .submit{background:#2563eb;border:0;font-weight:700;cursor:pointer}
    .google-wrap{margin-top:14px;display:flex;justify-content:center;min-height:44px}
    .divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:#94a3b8;font-size:13px}
    .divider::before,.divider::after{content:"";height:1px;background:#334155;flex:1}
    a{color:#93c5fd}#msg{min-height:24px}
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="platform-navbar" data-navbar aria-label="Main navigation"></nav>
    <main class="card">
      <h1>Login</h1>
      <form id="f">
        <input name="email" type="email" placeholder="Email" autocomplete="email" required>
        <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button class="submit" type="submit">Sign in</button>
      </form>
      <div class="divider" aria-hidden="true">or</div>
      <div id="google" class="google-wrap" aria-label="Google sign-in"></div>
      <p id="msg"></p>
      <p><a href="/register">Create account</a></p>
    </main>
  </div>

  <script src="/navbar.js" defer></script>
  <script>
    (() => {
      'use strict';
      const form = document.getElementById('f');
      const googleContainer = document.getElementById('google');
      const msg = document.getElementById('msg');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        msg.textContent = 'Signing in…';
        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: {'content-type': 'application/json'},
            credentials: 'same-origin',
            body: JSON.stringify(Object.fromEntries(new FormData(form)))
          });
          const data = await response.json();
          if (response.ok) window.location.href = '/dashboard';
          else msg.textContent = data.error || 'Login failed';
        } catch (_) {
          msg.textContent = 'Login request failed';
        }
      });

      function loadGoogleIdentityServices() {
        return new Promise((resolve, reject) => {
          if (window.google?.accounts?.id) return resolve();
          const existing = document.querySelector('script[data-google-gis]');
          if (existing) {
            existing.addEventListener('load', resolve, {once:true});
            existing.addEventListener('error', reject, {once:true});
            return;
          }
          const script = document.createElement('script');
          script.src = 'https://accounts.google.com/gsi/client';
          script.async = true;
          script.defer = true;
          script.dataset.googleGis = 'true';
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }

      async function setupGoogle() {
        try {
          const configResponse = await fetch('/api/auth/google/config', {cache:'no-store'});
          if (!configResponse.ok) return;
          const config = await configResponse.json();
          if (!config.clientId) return;

          await loadGoogleIdentityServices();
          google.accounts.id.initialize({
            client_id: config.clientId,
            callback: async ({credential}) => {
              msg.textContent = 'Verifying Google sign-in…';
              try {
                const response = await fetch('/api/auth/google/credential', {
                  method: 'POST',
                  headers: {'content-type': 'application/json'},
                  credentials: 'same-origin',
                  body: JSON.stringify({credential})
                });
                const data = await response.json();
                if (response.ok) window.location.href = '/dashboard';
                else msg.textContent = data.error || 'Google sign-in failed';
              } catch (_) {
                msg.textContent = 'Google sign-in request failed';
              }
            }
          });

          google.accounts.id.renderButton(googleContainer, {
            theme: 'outline',
            size: 'large',
            text: 'continue_with',
            shape: 'rectangular',
            width: 360
          });
        } catch (_) {
          // Keep normal email/password login available if GIS is unavailable.
        }
      }

      setupGoogle();
    })();
  </script>
</body>
</html>
