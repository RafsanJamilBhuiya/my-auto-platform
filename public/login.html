<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><style>body{margin:0;font:16px system-ui;background:#0f172a;color:#f8fafc;min-height:100vh;display:grid;place-items:center;padding:20px}form{width:min(420px,100%);background:#1e293b;padding:24px;border-radius:16px;box-sizing:border-box}input,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white}button{background:#2563eb;border:0;font-weight:700;cursor:pointer}a{color:#93c5fd}#msg{min-height:24px}</style></head><body><form id="f"><h1>Login</h1><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Sign in</button><button type="button" onclick="location.href='/api/auth/google'">Continue with Google</button><p id="msg"></p><a href="/register.html">Create account</a></form><script>f.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});const d=await r.json();if(r.ok)location.href='/dashboard';msg.textContent=d.error||'Login failed'}</script></body></html>
