<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · my-auto-platform</title><style>body{margin:0;font:16px system-ui;background:#0f172a;color:#f8fafc;min-height:100vh;padding:20px;box-sizing:border-box}.wrap{max-width:900px;margin:auto}.platform-navbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}.platform-navbar a,.platform-navbar button{padding:10px 14px;border:1px solid #334155;border-radius:9px;background:#111827;color:#f8fafc;text-decoration:none;cursor:pointer}.card{width:min(420px,100%);margin:auto;background:#1e293b;padding:24px;border-radius:16px;box-sizing:border-box}input,.submit{width:100%;padding:13px;margin:7px 0;box-sizing:border-box;border-radius:9px;border:1px solid #475569;background:#0f172a;color:white}.submit{background:#2563eb;border:0;font-weight:700;cursor:pointer}.google-wrap{margin-top:8px;display:flex;justify-content:center;min-height:44px}a{color:#93c5fd}#msg{min-height:24px}</style></head><body><div class="wrap"><nav class="platform-navbar" data-navbar aria-label="Main navigation"></nav><main class="card"><h1>Login</h1><form id="f"><input name="email" type="email" placeholder="Email" autocomplete="email" required><input name="password" type="password" placeholder="Password" autocomplete="current-password" required><button class="submit">Sign in</button></form><div id="google" class="google-wrap"></div><p id="msg"></p><p><a href="/register">Create account</a></p></main></div><script src="/navbar.js" defer></script><script>const f=document.getElementById('f'),msg=document.getElementById('msg');f.onsubmit=async e=>{e.preventDefault();msg.textContent='Signing in…';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))}),d=await r.json();if(r.ok)location.href='/dashboard';else msg.textContent=d.error||'Login failed'}catch(_){msg.textContent='Login request failed'}};
async function setupGoogle(){try{const r=await fetch('/api/auth/google/config',{cache:'no-store'}),cfg=await r.json();if(!cfg.clientId)return;const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.defer=true;s.onload=()=>{google.accounts.id.initialize({client_id:cfg.clientId,callback:async response=>{msg.textContent='Verifying Google sign-in…';try{const r=await fetch('/api/auth/google/credential',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({credential:response.credential})}),d=await r.json();if(r.ok)location.href='/dashboard';else msg.textContent=d.error||'Google sign-in failed'}catch(_){msg.textContent='Google sign-in request failed'}}});google.accounts.id.renderButton(document.getElementById('google'),{theme:'outline',size:'large',text:'continue_with',shape:'rectangular',width:360});};document.head.appendChild(s)}catch(_){}}setupGoogle();</script></body></html>
