<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Status · my-auto-platform</title><style>body{margin:0;padding:20px;font:16px system-ui;background:#020617;color:#f8fafc}.wrap{max-width:900px;margin:auto}.platform-navbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.platform-navbar a,.platform-navbar button{padding:10px 14px;border:1px solid #334155;border-radius:9px;background:#0f172a;color:#fff;text-decoration:none;cursor:pointer}.card{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:20px}.ok{color:#34d399}.muted{color:#94a3b8}.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1e293b}</style></head><body><div class="wrap"><nav class="platform-navbar" data-navbar></nav><section class="card"><h1>Live Status</h1><p id="summary" class="muted">Checking…</p><div id="data"></div></section></div><script src="/navbar.js" defer></script><script>const summary=document.getElementById('summary'),data=document.getElementById('data'),esc=v=>String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function refresh(){try{const [s,a,t]=await Promise.all([fetch('/api/devops/status',{cache:'no-store'}),fetch('/api/assistant/status',{cache:'no-store'}),fetch('/api/telegram/status',{cache:'no-store'})]);if(!s.ok)throw Error('Status API HTTP '+s.status);const d=await s.json(),ad=a.ok?await a.json():null,td=t.ok?await t.json():null;summary.innerHTML='<strong class="ok">'+esc(d.overallStatus)+'</strong> · updated '+esc(d.timestamp);data.innerHTML='<div class="row"><span>Architecture</span><b>'+esc(d.architecture)+'</b></div><div class="row"><span>Storage</span><b>'+esc(ad?.status?.storage||'native-json-memory')+'</b></div><div class="row"><span>Assistant</span><b>'+esc(a.ok?'Ready':'Unavailable')+'</b></div><div class="row"><span>Telegram</span><b>'+esc(td?.configured?'Configured':'Not configured')+'</b></div><div class="row"><span>Google</span><b><a href="/integrations">Integration configuration</a></b></div>';}catch(e){summary.textContent='Live status unavailable: '+e.message;}}refresh();setInterval(refresh,15000);</script></body></html>
